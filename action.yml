name: "equiv review"
description: '"It''s just a refactor." Prove it. Blocks the merge when a refactor, rewrite or port changes behaviour.'
branding:
  icon: "check-circle"
  color: "blue"
inputs:
  auto:
    description: >
      How to choose the functions to review. Unset (the default): use the
      manifest if it exists, otherwise detect every changed function from the
      PR diff, so no configuration is needed. "true": always detect from the
      diff and ignore any manifest. "false": use the manifest only (skip when
      there is none at base or in the PR). true/false in any letter case; any
      other value fails the job. Functions without supported type hints are reported as
      "changed, not checked", with the parameters that need a hint.
    required: false
    default: ""
  manifest:
    description: "Path to the equiv review manifest (lines: `file : fn : sig`). Optional; see `auto`."
    required: false
    default: ".equiv-review"
  base:
    description: >
      Base git ref to compare against (default: the PR's base branch). The
      manifest is read from this ref: lines listed there always run, whatever
      the PR did to the file. If the ref cannot be read the job fails; use
      `fetch-depth: 0` on actions/checkout.
    required: false
    default: ""
  fail-on-divergence:
    description: >
      Fail the check when any function changed behaviour. Unset (the default):
      fail when the PR has declared that behaviour must not change (functions
      listed in the manifest, or the PR carries the `only-label` label);
      otherwise report the change in the comment without blocking, because in
      an ordinary PR most changed functions change on purpose. "true"/"false"
      override this.
    required: false
    default: ""
  only-label:
    description: >
      Optional PR label (for example "refactor"). When set, the review runs only
      on PRs carrying this label, and a divergence blocks the merge by default.
      Other PRs are skipped. Use it to gate refactor, rewrite and port PRs
      without blocking feature work.
    required: false
    default: ""
  fail-on-not-checked:
    description: >
      Fail the check when nothing diverged but a changed function was not
      checked (safety stop, refused type, error, or no supported type hints).
      Off by default: such functions are always listed in the comment under
      "not checked", never shown as green, but do not block the merge. A review
      that did not run at all (bad manifest, base ref that cannot be read, an
      input that is neither true nor false) always fails.
    required: false
    default: "false"
  signing-key:
    description: >
      Optional ed25519 seed (64 hex chars) used to sign receipts (v0
      self-attestation). Pass it from a repository secret. Empty on fork
      PRs by design; receipts are then left unsigned. Never use
      pull_request_target to force it. See docs/signing-model.md.
    required: false
    default: ""
  budget:
    description: >
      Step budget per call, in Python line/jump events (default 4000000).
      Raise it for heavy functions such as parsers on real files. Bound into
      every receipt.
    required: false
    default: ""
  keyless:
    description: >
      When "true", keyless-sign each in-toto attestation with cosign (Sigstore):
      OIDC workload identity -> Fulcio short-lived cert -> Rekor transparency
      log. No long-lived secret. Requires `permissions: id-token: write` in the
      calling workflow. This is the recommended trust model (DR-3).
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    # The step budget needs Python 3.12+ (sys.monitoring). Install it so the
    # runner's default never decides whether a review can run.
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
    - name: Resolve equiv binary (the pinned version's release, else build the pinned source)
      shell: bash
      env:
        # Authenticated download. Works for private repos (plain curl 404s on
        # private release assets). The resolver downloads the release matching the
        # version in this Action's own Cargo.toml (never "latest") and checks it
        # against the release's .sha256 file, else builds the source with --locked.
        GH_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
        EQUIV_ACTION_REPO: ${{ github.action_repository || 'Neelagiri65/equiv' }}
        EQUIV_TARGET: x86_64-unknown-linux-gnu   # GitHub Linux runners
      run: bash "${{ github.action_path }}/scripts/resolve-equiv-binary.sh"
    - name: Install cosign (keyless signing)
      if: ${{ inputs.keyless == 'true' }}
      uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
    - name: Run review + post comment
      shell: bash
      env:
        # EQUIV_BIN is set by the resolve step via $GITHUB_ENV.
        EQUIV_MANIFEST: ${{ inputs.manifest }}
        EQUIV_AUTO: ${{ inputs.auto }}
        EQUIV_BASE_INPUT: ${{ inputs.base }}
        EQUIV_FAIL: ${{ inputs.fail-on-divergence }}
        EQUIV_ONLY_LABEL: ${{ inputs.only-label }}
        EQUIV_FAIL_NOT_CHECKED: ${{ inputs.fail-on-not-checked }}
        EQUIV_BUDGET: ${{ inputs.budget }}
        # Secret seed, masked by Actions; the entrypoint never echoes it.
        EQUIV_SIGNING_KEY: ${{ inputs.signing-key }}
        EQUIV_KEYLESS: ${{ inputs.keyless }}
        GH_TOKEN: ${{ github.token }}
      run: bash ${{ github.action_path }}/scripts/equiv-review-entrypoint.sh
    - name: Upload receipts + attestations
      if: ${{ hashFiles('equiv-receipts.tsv', 'equiv-attestations/**') != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: equiv-receipts
        path: |
          equiv-receipts.tsv
          equiv-attestations/
        if-no-files-found: ignore
