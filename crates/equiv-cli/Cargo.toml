[package]
name = "equiv-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "equiv: deterministic checker for AI-emitted WASM artifacts"

[[bin]]
name = "equiv"
path = "src/main.rs"

[dependencies]
equiv-core = { path = "../equiv-core" }
equiv-engine = { path = "../equiv-engine" }
equiv-review = { path = "../equiv-review" }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wat = "1"
sha2 = "0.10"
