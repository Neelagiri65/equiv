name: guard

# Founding-rule gate: tests, divergence corpus vs baseline, no overclaiming
# wording, and commit identity on every pull request. See scripts/harness/check.sh.
on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Harness check
        env:
          EQUIV_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/harness/check.sh
