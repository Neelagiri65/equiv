# Example: run the equiv behaviour-preserving review on every PR.
name: equiv review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write   # to post the sticky comment
  id-token: write        # keyless Sigstore signing (OIDC); harmless if unused
jobs:
  equiv-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need base history to diff against
      # This repo runs its own action from the checkout, so a change to
      # action.yml or the entrypoint is exercised by the PR that makes it.
      # Users copy the pinned form from the README (`Neelagiri65/equiv@vX.Y.Z`).
      - uses: ./
        with:
          manifest: .equiv-review
          fail-on-divergence: "true"
          # "Not checked" functions are listed in the comment, never shown as
          # green, and block the merge only if you opt in:
          # fail-on-not-checked: "true"
          # Keyless (recommended): no secret; signs with the run's OIDC identity.
          keyless: "true"
          # OR v0 self-attestation with a long-lived key (empty on fork PRs):
          # signing-key: ${{ secrets.EQUIV_SIGNING_KEY }}
