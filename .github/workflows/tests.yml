name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The AD-1 targets: macOS arm64, Linux x86-64, Linux arm64. The float
        # golden-receipt test asserts a fixed receipt-id; if any host computes
        # different bytes, AD-1 (byte-identical cross-host) is broken and this
        # matrix goes red.
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # One Python minor on every host: the receipt carries the evaluator's
      # major.minor and the goldens pin their id to this one.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Toolchain versions
        run: rustc --version && cargo --version && python3 --version
      - name: cargo test (includes the cross-host golden receipt)
        run: cargo test --workspace
      - name: cargo test engine with uncertified-proofs (keeps the gated BMC path from rotting)
        run: cargo test -p equiv-engine --features uncertified-proofs
